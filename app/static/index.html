<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket to Code</title><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18212b}header{padding:1rem 2rem;background:#15263a;color:white;display:flex;justify-content:space-between}main{max-width:1100px;margin:2rem auto;display:grid;grid-template-columns:2fr 1fr;gap:1rem;padding:0 1rem}section,aside{background:white;border:1px solid #dae0e7;border-radius:12px;padding:1.25rem}#messages{height:55vh;overflow:auto}.bubble{padding:.75rem 1rem;margin:.5rem 0;border-radius:10px;white-space:pre-wrap}.user{background:#e4f0ff;margin-left:12%}.assistant{background:#eef1f3;margin-right:12%}form{display:flex;gap:.5rem;margin-top:1rem}textarea{flex:1;min-height:70px}button,input,textarea{font:inherit;padding:.5rem}button{cursor:pointer}aside pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem}#status{font-weight:600} @media(max-width:750px){main{display:block}aside{margin-top:1rem}}
</style></head><body><header><strong>Ticket to Code</strong><a href="/flappy" style="color:white">Flappy Bird provisional</a></header>
<main><section><label>Token de acceso <input type="password" id="token" placeholder="AUTH_TOKENS"></label> <button id="new">Nueva conversación</button>
<p id="conversation"></p><div id="messages" aria-live="polite"></div><p id="status"></p>
<form id="send"><textarea id="content" required placeholder="Describe tu ticket o pregunta por el código entregado"></textarea><button>Enviar</button></form></section>
<aside><h2>Trazas</h2><p>Decisiones y salidas estructuradas de cada agente. El código generado no se ejecuta.</p><pre id="traces"></pre><h2>Archivos</h2><pre id="files"></pre></aside></main>
<script>
const token=document.querySelector('#token'), messages=document.querySelector('#messages'), status=document.querySelector('#status');let conversationId=null;
const api=async(path,options={})=>{let r=await fetch(path,{...options,headers:{'Authorization':'Bearer '+token.value,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error((await r.json()).detail||r.statusText);return r.json()};
function bubble(role,content){let el=document.createElement('div');el.className='bubble '+role;el.textContent=content;messages.append(el);messages.scrollTop=messages.scrollHeight}
document.querySelector('#new').onclick=async()=>{try{let c=await api('/api/conversations',{method:'POST'});conversationId=c.id;messages.replaceChildren();document.querySelector('#conversation').textContent='Conversación: '+c.id;status.textContent='';document.querySelector('#traces').textContent='';document.querySelector('#files').textContent=''}catch(e){status.textContent=e.message}};
document.querySelector('#send').onsubmit=async(e)=>{e.preventDefault();let content=document.querySelector('#content').value.trim();if(!content)return;try{if(!conversationId)await document.querySelector('#new').onclick();if(!conversationId)return;let run=await api('/api/conversations/'+conversationId+'/messages',{method:'POST',body:JSON.stringify({content})});bubble('user',content);document.querySelector('#content').value='';status.textContent='Procesando…';while(true){await new Promise(r=>setTimeout(r,1000));let result=await api('/api/runs/'+run.run_id);if(['approved','answered','exhausted','technical_error'].includes(result.status)){bubble('assistant',result.result||result.error||'Sin respuesta');status.textContent={approved:'Aprobado',answered:'Pregunta respondida',exhausted:'Sin aprobación tras agotar intentos',technical_error:'Error técnico'}[result.status]+' · Código '+(result.execution==='not_executed'?'no ejecutado':'ejecutado');let traces=await api('/api/runs/'+run.run_id+'/traces');let files=await api('/api/runs/'+run.run_id+'/files');document.querySelector('#traces').textContent=JSON.stringify(traces,null,2);document.querySelector('#files').textContent=JSON.stringify(files,null,2);break}else status.textContent=result.status==='queued'?'En cola…':'Procesando…'}}catch(err){status.textContent=err.message}};
</script></body></html>
