<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batcomputer · Cartografunk</title><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18212b}header{padding:1rem 2rem;background:#15263a;color:white;display:flex;justify-content:space-between}header a{color:white}main{max-width:1200px;margin:2rem auto;display:grid;grid-template-columns:2fr 1fr;gap:1rem;padding:0 1rem}section,aside{background:white;border:1px solid #dae0e7;border-radius:12px;padding:1.25rem}#messages{height:55vh;overflow:auto}.bubble{padding:.75rem 1rem;margin:.5rem 0;border-radius:10px;white-space:pre-wrap}.user{background:#e4f0ff;margin-left:12%}.assistant{background:#eef1f3;margin-right:12%}form{display:flex;gap:.5rem;margin-top:1rem}textarea{flex:1;min-height:70px}button,input,textarea,select{font:inherit;padding:.5rem}button{cursor:pointer}aside pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem;max-height:260px;overflow:auto}#status{font-weight:600}#preview{width:100%;height:320px;border:1px solid #dae0e7;background:white}#preview[hidden],#retry[hidden]{display:none}details{margin-bottom:1rem}summary{cursor:pointer;font-weight:600}#traces{list-style:none;padding:0;max-height:280px;overflow:auto}#traces li{border-left:3px solid #6e92ad;padding:.4rem .7rem;margin:.4rem 0;background:#f4f7fa}#file-picker{max-width:100%;width:100%}@media(max-width:750px){main{display:block}aside{margin-top:1rem}}
</style></head><body><header><strong>Cartografunk · Batcomputer</strong><nav><a href="https://www.cartografunk.com/">Volver a Cartografunk</a> · <a href="/flappy">Flappy Bird provisional</a></nav></header>
<main><section><label>Token de acceso <input type="password" id="token" placeholder="AUTH_TOKENS"></label> <button id="new">Nueva conversación</button>
<p id="conversation"></p><div id="messages" aria-live="polite"></div><p id="status"></p><button id="retry" hidden>Reintentar trabajo pausado</button>
<form id="send"><textarea id="content" required placeholder="Describe tu ticket o pregunta por el código entregado"></textarea><button>Enviar</button></form></section>
<aside><details open><summary>Trazas de agentes</summary><p>Progreso en tiempo real. El chat muestra solo la respuesta final.</p><ol id="traces" aria-live="polite"></ol></details><h2>Código entregado</h2><select id="file-picker" aria-label="Archivo generado"><option>Sin archivos</option></select><pre id="files"></pre><h2>Vista previa restringida</h2><p id="preview-note">Disponible para HTML aprobado.</p><iframe id="preview" title="Vista previa de código generado" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe></aside></main>
<script>
const token=document.querySelector('#token'), messages=document.querySelector('#messages'), status=document.querySelector('#status'), preview=document.querySelector('#preview'), previewNote=document.querySelector('#preview-note'), retryButton=document.querySelector('#retry');let conversationId=null,lastRunId=null,streamController=null;
const api=async(path,options={})=>{let r=await fetch(path,{...options,headers:{'Authorization':'Bearer '+token.value,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error((await r.json()).detail||r.statusText);return r.json()};
function bubble(role,content){let el=document.createElement('div');el.className='bubble '+role;el.textContent=content;messages.append(el);messages.scrollTop=messages.scrollHeight}
function addTrace(event){let li=document.createElement('li');li.textContent=event.node+': '+event.status;document.querySelector('#traces').append(li);li.scrollIntoView({block:'nearest'})}
function showFiles(files){const picker=document.querySelector('#file-picker'),out=document.querySelector('#files');picker.replaceChildren();const attempt=Math.max(0,...files.map(file=>file.attempt));const snapshot=files.filter(file=>file.attempt===attempt);if(!snapshot.length){picker.add(new Option('Sin archivos',''));out.textContent='';return}snapshot.forEach((file,index)=>picker.add(new Option(file.path,String(index))));picker.onchange=()=>out.textContent=snapshot[Number(picker.value)]?.content||'';picker.value='0';picker.onchange()}
async function streamTraces(sessionId,runId){streamController?.abort();streamController=new AbortController();try{const response=await fetch('/stream/'+sessionId+'?run_id='+encodeURIComponent(runId),{headers:{Authorization:'Bearer '+token.value},signal:streamController.signal});if(!response.ok)throw Error('No se pudieron abrir las trazas');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){const packet=buffer.slice(0,end);buffer=buffer.slice(end+2);const data=packet.split('\n').find(line=>line.startsWith('data: '));if(data){const event=JSON.parse(data.slice(6));if(packet.includes('event: trace'))addTrace(event)}}}}catch(error){if(error.name!=='AbortError')addTrace({node:'Conexión',status:error.message})}}
function showPreview(files,run){
  preview.hidden=true;preview.srcdoc='';
  if(run.status!=='approved'){previewNote.textContent='La vista previa requiere HTML aprobado.';return}
  const attempt=Math.max(0,...files.map(file=>file.attempt));
  const snapshot=files.filter(file=>file.attempt===attempt);
  const html=snapshot.find(file=>file.path.endsWith('.html'));
  if(!html){previewNote.textContent='Esta entrega no contiene HTML.';return}
  const policy="default-src 'none'; base-uri 'none'; connect-src 'none'; img-src data: blob:; media-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; navigate-to 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'";
  const css=snapshot.filter(file=>file.path.endsWith('.css')).map(file=>'<style>'+file.content.replace(/<\/style/gi,'<\\/style')+'<'+'/style>').join('');
  const js=snapshot.filter(file=>file.path.endsWith('.js')).map(file=>'<script>'+file.content.replace(/<\/script/gi,'<\\/script')+'<'+'/script>').join('');
  preview.srcdoc='<!doctype html><meta http-equiv="Content-Security-Policy" content="'+policy+'">'+css+html.content+js;
  preview.hidden=false;previewNote.textContent='Iframe aislado: scripts locales permitidos; recursos externos bloqueados.';
}
document.querySelector('#new').onclick=async()=>{try{let c=await api('/api/conversations',{method:'POST'});conversationId=c.id;streamController?.abort();messages.replaceChildren();preview.hidden=true;preview.srcdoc='';retryButton.hidden=true;document.querySelector('#conversation').textContent='Conversación: '+c.id;status.textContent='';document.querySelector('#traces').replaceChildren();showFiles([])}catch(e){status.textContent=e.message}};
async function watchRun(runId){lastRunId=runId;retryButton.hidden=true;streamTraces(conversationId,runId);while(true){await new Promise(resolve=>setTimeout(resolve,900));const result=await api('/api/runs/'+runId);if(['approved','answered','needs_clarification','exhausted','technical_error','paused'].includes(result.status)){bubble('assistant',result.result||result.error||'Sin respuesta');const labels={approved:'Aprobado',answered:'Pregunta respondida',needs_clarification:'Aclaración pendiente',exhausted:'Límite de revisión alcanzado',technical_error:'Error técnico',paused:'Pausado'},validation={passed:'validación aislada completada',failed:'validación fallida',error:'validación no disponible',not_executed:'código no ejecutado'};status.textContent=labels[result.status]+' · '+validation[result.validation_status];retryButton.hidden=result.status!=='paused';const files=await api('/api/runs/'+runId+'/files');showFiles(files);showPreview(files,result);break}status.textContent=result.status==='queued'?'En cola…':'Procesando…'}}
retryButton.onclick=async()=>{try{const run=await api('/api/runs/'+lastRunId+'/retry',{method:'POST'});await watchRun(run.run_id)}catch(error){status.textContent=error.message}};
document.querySelector('#send').onsubmit=async(event)=>{event.preventDefault();const content=document.querySelector('#content').value.trim();if(!content)return;try{if(!conversationId)await document.querySelector('#new').onclick();if(!conversationId)return;const run=await api('/api/conversations/'+conversationId+'/messages',{method:'POST',body:JSON.stringify({content})});bubble('user',content);document.querySelector('#content').value='';document.querySelector('#traces').replaceChildren();status.textContent='En cola…';await watchRun(run.run_id)}catch(error){status.textContent=error.message}};
</script></body></html>
