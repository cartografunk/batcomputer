<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batcomputer · Cartografunk</title><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18212b}header{padding:1rem 2rem;background:#15263a;color:white;display:flex;justify-content:space-between}header a{color:white}main{max-width:1100px;margin:2rem auto;display:grid;grid-template-columns:2fr 1fr;gap:1rem;padding:0 1rem}section,aside{background:white;border:1px solid #dae0e7;border-radius:12px;padding:1.25rem}#messages{height:55vh;overflow:auto}.bubble{padding:.75rem 1rem;margin:.5rem 0;border-radius:10px;white-space:pre-wrap}.user{background:#e4f0ff;margin-left:12%}.assistant{background:#eef1f3;margin-right:12%}form{display:flex;gap:.5rem;margin-top:1rem}textarea{flex:1;min-height:70px}button,input,textarea{font:inherit;padding:.5rem}button{cursor:pointer}aside pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem}#status{font-weight:600}#preview{width:100%;height:320px;border:1px solid #dae0e7;background:white}#preview[hidden]{display:none}@media(max-width:750px){main{display:block}aside{margin-top:1rem}}
</style></head><body><header><strong>Cartografunk · Batcomputer</strong><nav><a href="https://www.cartografunk.com/">Volver a Cartografunk</a> · <a href="/flappy">Flappy Bird provisional</a></nav></header>
<main><section><label>Token de acceso <input type="password" id="token" placeholder="AUTH_TOKENS"></label> <button id="new">Nueva conversación</button>
<p id="conversation"></p><div id="messages" aria-live="polite"></div><p id="status"></p>
<form id="send"><textarea id="content" required placeholder="Describe tu ticket o pregunta por el código entregado"></textarea><button>Enviar</button></form></section>
<aside><h2>Trazas</h2><p>Decisiones y salidas estructuradas de cada agente. La validación y la aprobación son estados separados.</p><pre id="traces"></pre><h2>Archivos</h2><pre id="files"></pre><h2>Vista previa restringida</h2><p id="preview-note">Disponible para HTML aprobado.</p><iframe id="preview" title="Vista previa de código generado" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe></aside></main>
<script>
const token=document.querySelector('#token'), messages=document.querySelector('#messages'), status=document.querySelector('#status'), preview=document.querySelector('#preview'), previewNote=document.querySelector('#preview-note');let conversationId=null;
const api=async(path,options={})=>{let r=await fetch(path,{...options,headers:{'Authorization':'Bearer '+token.value,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error((await r.json()).detail||r.statusText);return r.json()};
function bubble(role,content){let el=document.createElement('div');el.className='bubble '+role;el.textContent=content;messages.append(el);messages.scrollTop=messages.scrollHeight}
function showPreview(files,run){
  preview.hidden=true;preview.srcdoc='';
  if(run.status!=='approved'){previewNote.textContent='La vista previa requiere HTML aprobado.';return}
  const attempt=Math.max(0,...files.map(file=>file.attempt));
  const snapshot=files.filter(file=>file.attempt===attempt);
  const html=snapshot.find(file=>file.path.endsWith('.html'));
  if(!html){previewNote.textContent='Esta entrega no contiene HTML.';return}
  const policy="default-src 'none'; base-uri 'none'; connect-src 'none'; img-src data: blob:; media-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; navigate-to 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'";
  const css=snapshot.filter(file=>file.path.endsWith('.css')).map(file=>'<style>'+file.content.replace(/<\/style/gi,'<\\/style')+'<'+'/style>').join('');
  const js=snapshot.filter(file=>file.path.endsWith('.js')).map(file=>'<script>'+file.content.replace(/<\/script/gi,'<\\/script')+'<'+'/script>').join('');
  preview.srcdoc='<!doctype html><meta http-equiv="Content-Security-Policy" content="'+policy+'">'+css+html.content+js;
  preview.hidden=false;previewNote.textContent='Iframe aislado: scripts locales permitidos; recursos externos bloqueados.';
}
document.querySelector('#new').onclick=async()=>{try{let c=await api('/api/conversations',{method:'POST'});conversationId=c.id;messages.replaceChildren();preview.hidden=true;preview.srcdoc='';document.querySelector('#conversation').textContent='Conversación: '+c.id;status.textContent='';document.querySelector('#traces').textContent='';document.querySelector('#files').textContent=''}catch(e){status.textContent=e.message}};
document.querySelector('#send').onsubmit=async(e)=>{e.preventDefault();let content=document.querySelector('#content').value.trim();if(!content)return;try{if(!conversationId)await document.querySelector('#new').onclick();if(!conversationId)return;let run=await api('/api/conversations/'+conversationId+'/messages',{method:'POST',body:JSON.stringify({content})});bubble('user',content);document.querySelector('#content').value='';status.textContent='Procesando…';while(true){await new Promise(r=>setTimeout(r,1000));let result=await api('/api/runs/'+run.run_id);if(['approved','answered','needs_clarification','exhausted','technical_error'].includes(result.status)){bubble('assistant',result.result||result.error||'Sin respuesta');const labels={approved:'Aprobado',answered:'Pregunta respondida',needs_clarification:'Aclaración pendiente',exhausted:'Sin aprobación tras agotar intentos',technical_error:'Error técnico'},validation={passed:'validación aislada completada',failed:'validación aislada fallida',error:'validación aislada no disponible',not_executed:'código no ejecutado'};status.textContent=labels[result.status]+' · '+validation[result.validation_status];let traces=await api('/api/runs/'+run.run_id+'/traces');let files=await api('/api/runs/'+run.run_id+'/files');document.querySelector('#traces').textContent=JSON.stringify(traces,null,2);document.querySelector('#files').textContent=JSON.stringify(files,null,2);showPreview(files,result);break}else status.textContent=result.status==='queued'?'En cola…':'Procesando…'}}catch(err){status.textContent=err.message}};
</script></body></html>
