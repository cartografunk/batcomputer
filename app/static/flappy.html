<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Bird independiente · Batcomputer</title><style>body{background:#172c3e;color:white;font:18px system-ui;text-align:center}canvas{background:linear-gradient(#8dd9ff,#ccefff);max-width:95vw;border:4px solid white;border-radius:8px}</style></head><body><h1>Flappy Bird</h1><p>Demo independiente: este juego no fue generado por los agentes. Espacio, clic o toque para volar.</p><canvas id="game" width="400" height="600"></canvas><p><a href="/" style="color:white">Volver a Batcomputer y pedir un juego a los agentes</a> · <a href="https://www.cartografunk.com/" style="color:white">Volver a Cartografunk</a></p><script>
const c=document.querySelector('#game'),x=c.getContext('2d');let bird,pipes,score,over,frame;
function reset(){bird={x:80,y:300,v:0};pipes=[];score=0;over=false;frame=0}function flap(){if(over)reset();bird.v=-7}document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});c.addEventListener('pointerdown',flap);
function draw(){x.clearRect(0,0,400,600);if(!over){frame++;bird.v+=.38;bird.y+=bird.v;if(frame%95===0){let top=70+Math.random()*260;pipes.push({x:400,top,passed:false})}for(let p of pipes){p.x-=2.5;if(!p.passed&&p.x+56<bird.x){p.passed=true;score++}if(bird.x+14>p.x&&bird.x-14<p.x+56&&(bird.y-14<p.top||bird.y+14>p.top+155))over=true}pipes=pipes.filter(p=>p.x>-60);if(bird.y<0||bird.y>600)over=true}x.fillStyle='#2ca56a';for(let p of pipes){x.fillRect(p.x,0,56,p.top);x.fillRect(p.x,p.top+155,56,600)}x.fillStyle='#ffcd43';x.beginPath();x.arc(bird.x,bird.y,14,0,Math.PI*2);x.fill();x.fillStyle='#17334b';x.font='bold 30px system-ui';x.fillText(score,20,42);if(over){x.fillStyle='#17334b';x.font='bold 28px system-ui';x.fillText('Fin · toca para reiniciar',55,300)}requestAnimationFrame(draw)}reset();draw();
</script></body></html>
