<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="520" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Batcomputer · Arquitectura</text>

  <!-- Usuario -->
  <rect x="30" y="270" width="150" height="80" rx="10" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="105" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4f87">Usuario</text>
  <text x="105" y="325" text-anchor="middle" font-size="12" fill="#1d4f87">Chat en el navegador</text>
  <text x="105" y="376" text-anchor="middle" font-size="11" fill="#555">batcomputer.cartografunk.com</text>
  <text x="105" y="392" text-anchor="middle" font-size="11" fill="#555">(DNS en Cloudflare)</text>
  <line x1="180" y1="310" x2="218" y2="310" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- Railway -->
  <rect x="220" y="60" width="560" height="480" rx="14" fill="#f4effc" stroke="#7b4fc4" stroke-width="2"/>
  <text x="240" y="86" font-size="16" font-weight="bold" fill="#5a2fa0">Railway · un solo servicio (FastAPI + worker)</text>

  <rect x="240" y="100" width="520" height="52" rx="8" fill="#ffffff" stroke="#7b4fc4"/>
  <text x="500" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">FastAPI · chat, API y trazas en vivo (SSE)</text>
  <text x="500" y="141" text-anchor="middle" font-size="12" fill="#555">Cola de trabajos y checkpoints de LangGraph (volumen persistente)</text>

  <text x="240" y="185" font-size="13" font-weight="bold" fill="#5a2fa0">Pipeline de agentes (LangGraph)</text>

  <!-- fila 1 -->
  <rect x="240" y="198" width="110" height="52" rx="8" fill="#fff6e0" stroke="#d99a1b" stroke-width="2"/>
  <text x="295" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Router</text>
  <text x="295" y="237" text-anchor="middle" font-size="11" fill="#555">¿qué pidió?</text>

  <rect x="370" y="198" width="110" height="52" rx="8" fill="#fff6e0" stroke="#d99a1b" stroke-width="2"/>
  <text x="425" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Planner</text>
  <text x="425" y="237" text-anchor="middle" font-size="11" fill="#555">tareas y criterios</text>

  <rect x="500" y="198" width="110" height="52" rx="8" fill="#fff6e0" stroke="#d99a1b" stroke-width="2"/>
  <text x="555" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Coder</text>
  <text x="555" y="237" text-anchor="middle" font-size="11" fill="#555">escribe el código</text>

  <rect x="630" y="198" width="120" height="52" rx="8" fill="#fff6e0" stroke="#d99a1b" stroke-width="2"/>
  <text x="690" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Tester</text>
  <text x="690" y="237" text-anchor="middle" font-size="11" fill="#555">valida / ejecuta</text>

  <line x1="350" y1="224" x2="368" y2="224" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="224" x2="498" y2="224" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="224" x2="628" y2="224" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- fila 2 -->
  <rect x="630" y="330" width="120" height="52" rx="8" fill="#fff6e0" stroke="#d99a1b" stroke-width="2"/>
  <text x="690" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Reviewer</text>
  <text x="690" y="369" text-anchor="middle" font-size="11" fill="#555">aprueba o rechaza</text>

  <rect x="400" y="330" width="120" height="52" rx="8" fill="#fff6e0" stroke="#d99a1b" stroke-width="2"/>
  <text x="460" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Documenter</text>
  <text x="460" y="369" text-anchor="middle" font-size="11" fill="#555">README de la entrega</text>

  <line x1="690" y1="250" x2="690" y2="328" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="630" y1="356" x2="522" y2="356" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="576" y="348" text-anchor="middle" font-size="11" fill="#555">aprueba o se agotan</text>
  <line x1="640" y1="330" x2="575" y2="252" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="590" y="300" text-anchor="end" font-size="11" fill="#c0392b">rechaza: reintenta</text>
  <text x="590" y="314" text-anchor="end" font-size="11" fill="#c0392b">(máx. 3 intentos)</text>

  <!-- resultados -->
  <line x1="460" y1="382" x2="400" y2="428" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="382" x2="560" y2="428" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="320" y="430" width="140" height="44" rx="8" fill="#e6f6ea" stroke="#2e8b57" stroke-width="2"/>
  <text x="390" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e6b40">Aprobado</text>
  <rect x="480" y="430" width="200" height="44" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="580" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#a02a1d">Agotado</text>
  <text x="580" y="466" text-anchor="middle" font-size="11" fill="#a02a1d">nunca se presenta como aprobado</text>

  <text x="240" y="505" font-size="12" fill="#555">Si el modelo falla (timeout, tokens): el trabajo queda en «paused» con botón de reintento.</text>
  <text x="240" y="525" font-size="12" fill="#555">Apoyos opcionales del Planner: Research (Tavily) y Scout (GitHub).</text>

  <!-- Externos -->
  <text x="925" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Servicios externos</text>

  <rect x="830" y="70" width="190" height="84" rx="10" fill="#e3f7ee" stroke="#1f9d6b" stroke-width="2"/>
  <text x="925" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#157a52">Supabase</text>
  <text x="925" y="118" text-anchor="middle" font-size="12" fill="#157a52">PostgreSQL (conversaciones,</text>
  <text x="925" y="134" text-anchor="middle" font-size="12" fill="#157a52">trazas) y Auth (login)</text>

  <rect x="830" y="176" width="190" height="84" rx="10" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="925" y="204" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4f87">Azure OpenAI</text>
  <text x="925" y="224" text-anchor="middle" font-size="12" fill="#1d4f87">Modelo de los agentes</text>
  <text x="925" y="240" text-anchor="middle" font-size="12" fill="#1d4f87">(también Gemini u Ollama)</text>

  <rect x="830" y="282" width="190" height="56" rx="10" fill="#f7f7f7" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="925" y="307" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">Tavily (opcional)</text>
  <text x="925" y="325" text-anchor="middle" font-size="12" fill="#555">búsqueda web</text>

  <rect x="830" y="360" width="190" height="56" rx="10" fill="#f7f7f7" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="925" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">GitHub (opcional)</text>
  <text x="925" y="403" text-anchor="middle" font-size="12" fill="#555">Scout: código de referencia</text>

  <rect x="830" y="438" width="190" height="56" rx="10" fill="#f7f7f7" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="925" y="463" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">E2B (opcional)</text>
  <text x="925" y="481" text-anchor="middle" font-size="12" fill="#555">sandbox para ejecutar código</text>

  <line x1="780" y1="112" x2="828" y2="112" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="780" y1="218" x2="828" y2="218" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="780" y1="310" x2="828" y2="310" stroke="#888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="780" y1="388" x2="828" y2="388" stroke="#888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="780" y1="466" x2="828" y2="466" stroke="#888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <text x="30" y="575" font-size="11" fill="#777">Líneas punteadas: servicios opcionales. El código está en GitHub (cartografunk/batcomputer).</text>
</svg>
